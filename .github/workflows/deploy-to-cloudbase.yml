name: Deploy to Tencent CloudBase

on:
  push:
    branches: [ main ]  # 当代码推送到 main 分支时触发，您可以根据需要改为 master 或其他分支
  workflow_dispatch:    # 允许手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'  # 使用您项目所需的 Node.js 版本

    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8

    - name: Install dependencies
      run: pnpm install

    - name: Build project
      run: pnpm run build  # 执行构建，生成 dist 目录

    - name: Deploy to Tencent CloudBase
      uses: TencentCloudBase/cloudbase-action@v2
      with:
        secretId: ${{ secrets.TENCENT_SECRET_ID }}
        secretKey: ${{ secrets.TENCENT_SECRET_KEY }}
        envId: ${{ secrets.TENCENT_ENV_ID }}
        # 静态托管部署配置
        staticSrcPath: ./dist  # 您构建产物的目录
        staticOptions: '{"ignore":["node_modules/**","README.md"]}'  # 可选：忽略文件
